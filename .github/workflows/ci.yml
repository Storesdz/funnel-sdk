name: SDK CI and release
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sdk-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: git diff --exit-code -- dist
      - run: bun run typecheck
      - run: bun run format:check
      - run: bun test
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:browser
      - run: bun run pack
      - uses: actions/upload-artifact@v4
        with:
          name: funnel-sdk
          path: |
            dist/storesdz-sdk.min.js
            dist/storesdz-sdk.min.js.sha256
            artifacts/*.tgz
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: funnel-sdk
          path: release
      - name: Verify version matches release tag
        run: node -e "if (process.env.GITHUB_REF_NAME !== 'v' + require('./package.json').version) process.exit(1)"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          release/dist/storesdz-sdk.min.js
          release/dist/storesdz-sdk.min.js.sha256
          release/artifacts/*.tgz
          --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
